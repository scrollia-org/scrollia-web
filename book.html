<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollia</title>
  <meta name="description" content="">

  <meta name="scrollia-api" content="https://api.scrollia.org">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161815" media="(prefers-color-scheme: dark)">

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <script>
    (function () {
      var pref;
      try { pref = localStorage.getItem("scrollia-theme"); } catch (_) {}
      if (pref !== "light" && pref !== "dark" && pref !== "amoled" && pref !== "auto") {
        pref = "auto";
      }
      var theme = pref === "auto"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : pref;
      var root = document.documentElement;
      root.dataset.themePref = pref;
      root.dataset.theme = theme;
    })();
  </script>

  <link rel="preload" href="assets/fonts/fraunces-semibold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/literata-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css?v=2">
  <link rel="stylesheet" href="styles.css?v=15">
</head>
<body>

  <a class="skip-link" href="#contenido" data-i18n="nav.skip">Saltar al contenido</a>

  <header class="nav">
    <a class="nav__logo" href="index.html" aria-label="Scrollia">
      <img src="assets/icons/favicon.svg" alt="" width="32" height="32">
      <span aria-hidden="true">crollia</span>
    </a>
    <nav class="nav__links" aria-label="Principal" data-i18n-aria="nav.label">
      <a href="catalog.html" data-i18n="nav.catalog">Catálogo</a>
      <a href="index.html#app" data-i18n="nav.app">App</a>
      <a href="index.html#mision" data-i18n="nav.mission">Misión</a>
    </nav>
    <div class="nav__tools">
      <select class="nav__lang" aria-label="Idioma" data-i18n-aria="nav.language">
        <option value="es" lang="es">Español</option>
        <option value="en" lang="en">English</option>
        <option value="fr" lang="fr">Français</option>
        <option value="de" lang="de">Deutsch</option>
        <option value="pt" lang="pt">Português</option>
        <option value="zh" lang="zh-Hans">中文</option>
      </select>
      <div class="theme-picker">
        <button type="button" class="nav__theme" aria-label="Tema" data-i18n-aria="nav.theme"
          aria-haspopup="listbox" aria-expanded="false" aria-controls="theme-menu">
          <svg class="icon icon--auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.25"/><path class="icon__fill" d="M12 4.75a7.25 7.25 0 0 0 0 14.5z"/></svg>
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.75v2M12 19.25v2M4.75 12h-2M21.25 12h-2M6.9 6.9 5.5 5.5M18.5 18.5l-1.4-1.4M6.9 17.1l-1.4 1.4M18.5 5.5l-1.4 1.4"/></svg>
          <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="icon icon--amoled" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.25"/><circle class="icon__fill" cx="12" cy="12" r="4.5"/></svg>
        </button>
        <div class="theme-menu" id="theme-menu" role="listbox" hidden>
          <button type="button" class="theme-menu__option" role="option" data-theme-option="auto" aria-selected="false">
            <span class="theme-menu__swatch theme-menu__swatch--auto" aria-hidden="true"></span>
            <span data-i18n="nav.themeAuto">Automático</span>
          </button>
          <button type="button" class="theme-menu__option" role="option" data-theme-option="light" aria-selected="false">
            <span class="theme-menu__swatch theme-menu__swatch--light" aria-hidden="true"></span>
            <span data-i18n="nav.themeLight">Claro</span>
          </button>
          <button type="button" class="theme-menu__option" role="option" data-theme-option="dark" aria-selected="false">
            <span class="theme-menu__swatch theme-menu__swatch--dark" aria-hidden="true"></span>
            <span data-i18n="nav.themeDark">Oscuro</span>
          </button>
          <button type="button" class="theme-menu__option" role="option" data-theme-option="amoled" aria-selected="false">
            <span class="theme-menu__swatch theme-menu__swatch--amoled" aria-hidden="true"></span>
            <span data-i18n="nav.themeAmoled">AMOLED</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Work page: all content comes from GET /works/{id} -->
  <main id="contenido" class="section work" aria-busy="true">
    <a class="work__back" href="catalog.html" data-i18n="work.back">Volver al catálogo</a>
    <p class="shelf__message work__loading" data-i18n="reader.loading">Abriendo el libro…</p>

    <div class="work__head">
      <div class="work__cover"><span class="cover-placeholder"></span></div>
      <div class="work__info">
        <p class="caption work__lang"></p>
        <h1 class="work__title"></h1>
        <p class="work__author"></p>
        <p class="work__meta"></p>
        <p class="work__pick" hidden>
          <label for="idioma-libro" data-i18n="work.edition">Idioma del libro</label>
          <select id="idioma-libro" class="work__select"></select>
        </p>
        <div class="work__actions"></div>
        <p class="work__edition"></p>

        <section class="work__synopsis" aria-labelledby="sinopsis" hidden>
          <div class="work__heading">
            <h2 id="sinopsis" data-i18n="work.synopsis">Sinopsis</h2>
            <span class="work__mark"></span>
          </div>
          <p class="work__note"></p>
          <div class="work__text"></div>
          <p class="work__attribution"></p>
        </section>
      </div>
    </div>

    <!-- Missing work or network error states, never an empty work page -->
    <div class="work__state" hidden>
      <p class="shelf__message"></p>
      <button type="button" class="btn btn--secondary" data-i18n="catalog.retry" hidden>Reintentar</button>
    </div>
    <noscript><p class="shelf__message">Activa JavaScript para ver esta obra.</p></noscript>
  </main>

  <footer class="footer">
    <div class="footer__brand">
      <img src="assets/icons/favicon.svg" alt="Scrollia" width="28" height="28">
      <span aria-hidden="true">crollia</span>
    </div>
    <div class="footer__text">
      <p data-i18n="footer.built">Construido sobre el corpus del <a href="https://www.gutenberg.org" rel="noopener">Project Gutenberg</a>, con ediciones de <a href="https://standardebooks.org" rel="noopener">Standard Ebooks</a></p>
      <p class="fine" data-i18n="footer.legal">Los libros son de dominio público en sus jurisdicciones correspondientes.</p>
      <p class="fine"><a href="mailto:contact@scrollia.org">contact@scrollia.org</a></p>
    </div>
  </footer>

  <script src="i18n.js?v=2"></script>
  <script src="app.js"></script>
  <script type="module" src="book.js"></script>
</body>
</html>
